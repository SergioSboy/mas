services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salesbench
      POSTGRES_USER: salesbench_owner
      POSTGRES_PASSWORD: demo_owner
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - salesbench_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesbench_owner -d salesbench"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  salesbench_pgdata:
